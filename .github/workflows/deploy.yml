name: QuantStrike CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quantstrike-production
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Validate backend code
        run: |
          cd backend
          python -m py_compile \
            api/management/commands/run_all_strategies.py \
            api/management/commands/update_instruments.py \
            api/services/market_data.py \
            api/services/smartapi_market.py \
            api/services/strategy_alpha.py \
            api/utils/contract_lookup.py
          echo "✓ Backend syntax validated"

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail

            echo "🚀 Starting QuantStrike deployment..."

            cd /var/www/QuantStrike

            echo "📥 Syncing latest code..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "🔧 Deploying backend..."
            cd /var/www/QuantStrike/backend

            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            pip install -r requirements.txt

            echo "📊 Running database migrations..."
            python manage.py migrate --noinput

            echo "📦 Collecting static files..."
            python manage.py collectstatic --noinput || echo "⚠️  Static files collection skipped"

            echo "🧩 Refreshing instrument metadata..."
            python manage.py update_instruments || echo "⚠️  update_instruments failed"

            echo "🚀 Restarting gunicorn..."
            sudo systemctl restart gunicorn

            echo "🎨 Deploying frontend..."
            cd /var/www/QuantStrike/frontend

            DEPLOY_USER="$(whoami)"
            sudo chown -R "$DEPLOY_USER":"$DEPLOY_USER" /var/www/QuantStrike/frontend

            npm ci
            npm run build

            sudo chown -R www-data:www-data /var/www/QuantStrike/frontend/dist || true

            echo "🔄 Reloading nginx..."
            sudo systemctl reload nginx

            echo "✅ Deployment completed successfully"

      - name: Post-deploy health check
        run: |
          set -euo pipefail

          FRONTEND_URL="http://${{ secrets.EC2_HOST }}/"
          API_URL="http://${{ secrets.EC2_HOST }}/api/"

          check_url() {
            local url="$1"
            local name="$2"
            local allowed_regex="$3"

            for attempt in {1..12}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [[ "$code" =~ $allowed_regex ]]; then
                echo "✅ $name healthy (HTTP $code)"
                return 0
              fi

              echo "⏳ $name not ready yet (HTTP ${code:-000}), retry ${attempt}/12"
              sleep 10
            done

            echo "❌ $name health check failed: $url"
            return 1
          }

          check_url "$FRONTEND_URL" "Frontend" '^(200|301|302)$'
          check_url "$API_URL" "API" '^(200|301|302|401|403)$'

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ QuantStrike deployment successful"
          echo "🌐 Frontend: http://${{ secrets.EC2_HOST }}"
          echo "📡 API: http://${{ secrets.EC2_HOST }}/api"
