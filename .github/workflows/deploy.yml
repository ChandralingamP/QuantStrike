name: Deploy QuantStrike

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      # ============================================
      # BUILD PHASE
      # ============================================

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Validate backend code
        run: |
          cd backend
          python -m py_compile api/views.py
          echo "✓ Backend syntax validated"

      # ============================================
      # DEPLOYMENT PHASE - SSH Deployment
      # ============================================

      - name: Deploy to EC2 Ubuntu instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "🚀 Starting QuantStrike deployment..."

            # Navigate to project
            cd /var/www/QuantStrike

            # Pull latest code
            echo "📥 Pulling latest code from GitHub..."
            git pull origin main

            # ============================================
            # BACKEND DEPLOYMENT
            # ============================================
            echo ""
            echo "🔧 Deploying backend..."
            cd /var/www/QuantStrike/backend

            # Install dependencies
            pip install -r requirements.txt

            # Run migrations
            echo "📊 Running database migrations..."
            python manage.py migrate --noinput || echo "⚠️  Migrations skipped"

            # Collect static files
            echo "📦 Collecting static files..."
            python manage.py collectstatic --noinput || echo "⚠️  Static files collection skipped"

            # Restart gunicorn service
            echo "🚀 Restarting gunicorn service..."
            sudo systemctl restart gunicorn || sudo systemctl restart quantstrike-backend || echo "⚠️ Could not restart gunicorn"
            sleep 3

            # ============================================
            # SCHEDULER SETUP (Automated Trading)
            # ============================================
            echo ""
            echo "⏰ Setting up automated trading scheduler..."
            cd /var/www/QuantStrike

            # Make deploy script executable
            chmod +x deploy-scheduler.sh

            # Run scheduler setup (production mode)
            ./deploy-scheduler.sh

            echo "✅ Scheduler configured for automated trading"
            echo "   - 7:00 AM: Instrument updates"
            echo "   - 7:05 AM: Metadata refresh"
            echo "   - 9:15 AM: Strategy execution for all active users"

            # ============================================
            # FRONTEND DEPLOYMENT
            # ============================================
            echo ""
            echo "🎨 Deploying frontend..."
            cd /var/www/QuantStrike/frontend

            # Install dependencies
            npm ci

            # Build frontend
            echo "🏗️  Building frontend..."
            npm run build

            # Deploy built files
            echo "📋 Copying built files to nginx directory..."
            sudo rm -rf /var/www/quantstrike-frontend/*
            sudo cp -r dist/* /var/www/quantstrike-frontend/

            # Set proper permissions
            sudo chown -R www-data:www-data /var/www/quantstrike-frontend || echo "⚠️ Permission change skipped"

            # Restart nginx
            echo "🔄 Restarting nginx service..."
            sudo systemctl restart nginx
            sleep 2

            echo ""
            echo "✅ Deployment completed successfully!"
            echo "🌐 Frontend: http://13.203.224.240"
            echo "📡 API: http://13.203.224.240/api"

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ QuantStrike deployment successful!"
          echo ""
          echo "📋 Deployment Summary:"
          echo "  - Frontend: Built and deployed"
          echo "  - Backend: Dependencies installed, migrations run"
          echo "  - Services: Gunicorn and Nginx restarted"
          echo "  - Scheduler: Automated trading cron jobs configured"
          echo ""
          echo "⏰ Automated Trading Schedule:"
          echo "  - 7:00 AM: Instrument updates (Mon-Fri)"
          echo "  - 7:05 AM: Metadata refresh (Mon-Fri)"
          echo "  - 9:15 AM: Execute strategies for all active users (Mon-Fri)"
          echo ""
          echo "🌐 Access your app at: http://13.203.224.240"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."
          exit 1
